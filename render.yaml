services:
  - type: web
    name: nova-ai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 1 -k gthread --threads 8 --timeout 120 app:app
    envVars:
      - key: NVIDIA_API_KEY_1
        sync: false
      - key: NVIDIA_API_KEY_2
        sync: false
      - key: NVIDIA_API_KEY_3
        sync: false
      - key: NVIDIA_API_KEY_4
        sync: false
      - key: NVIDIA_API_KEY_5
        sync: false
      - key: NVIDIA_API_KEY_6
        sync: false
